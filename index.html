<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <!-- Tên hiển thị trên tab trình duyệt -->
  <title>Ong Mặt Bự</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #202124;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      padding: 20px;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      gap: 15px;
    }

    /* Tên hiển thị trên trang */
    .page-title {
      margin: 0;
      color: white;
      font-size: 26px;
      text-align: center;
    }

    .pdf-container {
      width: min(90vw, 500px);
      max-height: 85vh;

      /* Kích thước dọc 9:16 */
      aspect-ratio: 9 / 16;

      background: white;
      overflow: hidden;
      border-radius: 10px;

      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.5);
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>

<body>
  <!-- Tên hiển thị phía trên PDF -->
  <h1 class="page-title">Ong Mặt Bự</h1>

  <div class="pdf-container">
    <iframe
      src="696932964_1576067744521580_1469210194418557271_n.pdf"
      title="Ong Mặt Bự">
    </iframe>
  </div>
</body>
</html>
